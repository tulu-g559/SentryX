[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentryx"
version = "0.1.0"
description = "SentryX: AI-powered Mission Control"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.scripts]
sentryx = "sentryx.main:cli"